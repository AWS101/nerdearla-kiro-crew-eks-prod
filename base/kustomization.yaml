# base/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nerdearla-eks

resources:
  - namespace.yaml
  - configmap-app.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: nerdearla-eks
    includeSelectors: false
