# overlays/demo/patch-deployment-v2.yaml
#
# ESTADO ROTO DE LA DEMO: el Deployment pasa a v2 pero NO se define
# PAYMENTS_API_URL. Resultado: el proceso termina al arrancar con la línea
# FATAL y el pod queda en CrashLoopBackOff.
#
# El FIX (PR que se aprueba en vivo) agrega la env PAYMENTS_API_URL acá
# (o vía el ConfigMap checkout-config). Ver overlays/demo/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  template:
    spec:
      containers:
        - name: checkout
          env:
            - name: PORT
              value: "8080"
            # Cambio de anoche: se subió a v2...
            - name: APP_VERSION
              value: "v2"
            # ...pero FALTA PAYMENTS_API_URL. Esa es la causa del incidente.
